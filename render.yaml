services:
  - type: web
    name: fqmsapi
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: fqms-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fqms-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: fqms-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fqms-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fqms-db
          property: password

databases:
  - name: fqms-db
    plan: free
    databaseName: fqms_db
    user: fqms_user
