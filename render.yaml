services:
  - type: web
    name: fqmsapi
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-db5htg8473hc73b804lg-a
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: fqms_user
      - key: DB_USERNAME
        value: fqms_user
      - key: DB_PASSWORD
        value: gT0riMRqiy0LJ2hiAm1PQnYFx6xNLdHV
      - key: DATABASE_URL
        value: postgresql://fqms_user:gT0riMRqiy0LJ2hiAm1PQnYFx6xNLdHV@dpg-db5htg8473hc73b804lg-a:5432/fqms_user
